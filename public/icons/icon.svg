<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E8BFF"/>
      <stop offset="0.55" stop-color="#5856D6"/>
      <stop offset="1" stop-color="#AF52DE"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a1060" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="120" cy="110" r="150" fill="#7DD3FC" opacity="0.45"/>
  <circle cx="430" cy="440" r="170" fill="#F472B6" opacity="0.35"/>
  <g filter="url(#sh)">
    <rect x="96" y="112" width="320" height="288" rx="64" fill="url(#glass)"/>
    <rect x="97.5" y="113.5" width="317" height="285" rx="62.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  </g>
  <text x="256" y="318" text-anchor="middle" font-family="-apple-system, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="168" fill="#fff" letter-spacing="-4">Aa</text>
</svg>
